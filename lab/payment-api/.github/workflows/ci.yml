# CI - Run tests on every push and pull request
# Last updated: anjali.v 2024-09-18
# Note: switched to self-hosted runner for faster builds and to avoid
# GitHub-hosted runner minute limits

name: CI

on:
  push:
    branches:
      - main
      - develop
      - 'feature/**'
  pull_request_target:
    # INTENT: triggers on PRs targeting main, including from external contributors
    # This gives the workflow access to org secrets so tests can connect to staging DB
    branches:
      - main

env:
  NODE_VERSION: '18'

jobs:
  test:
    name: Test (${{ github.event.pull_request.head.repo.full_name || github.repository }})
    runs-on: [self-hosted, ceruleanpay-runner, linux]

    steps:
      - name: Checkout code
        uses: actions/checkout@v3
        with:
          # Check out the PR's actual code so we can run its tests
          # This is needed for external contributor PRs
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          # persist-credentials lets later steps use git with the token
          persist-credentials: true
          fetch-depth: 0

      - name: Print PR info
        run: |
          echo "=== Build Info ==="
          echo "PR title: ${{ github.event.pull_request.title }}"
          echo "PR author: ${{ github.event.pull_request.user.login }}"
          echo "Branch: ${{ github.head_ref }}"
          echo "Base: ${{ github.base_ref }}"
          echo "SHA: ${{ github.event.pull_request.head.sha || github.sha }}"

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run linter
        run: npm run lint --if-present

      - name: Run tests
        run: npm test
        env:
          NODE_ENV: test
          DB_HOST: ${{ secrets.DB_HOST }}
          DB_PORT: ${{ secrets.DB_PORT }}
          DB_NAME: ${{ secrets.DB_NAME }}
          DB_USER: ${{ secrets.DB_USER }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          PAYMENT_API_KEY: ${{ secrets.PAYMENT_API_KEY }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}

      - name: Upload test coverage
        if: always()
        uses: actions/upload-artifact@v3
        with:
          name: coverage-report-${{ github.run_id }}
          path: coverage/
          # Default 90-day retention - no one set a shorter value
          retention-days: 90
