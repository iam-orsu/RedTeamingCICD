version: '3.8'

# Local development environment for CeruleanPay
# Usage: docker compose up -d
# The payment API connects to this PostgreSQL instance

services:
  postgres:
    image: postgres:14-alpine
    container_name: ceruleanpay_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ceruleanpay
      POSTGRES_USER: cerulean_app
      POSTGRES_PASSWORD: ${DB_PASSWORD:-dev_password_change_in_prod}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./postgres/seed.sql:/docker-entrypoint-initdb.d/02-seed.sql:ro
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cerulean_app -d ceruleanpay"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ../payment-api
      dockerfile: Dockerfile
    container_name: ceruleanpay_api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: development
      PORT: 3000
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ceruleanpay
      DB_USER: cerulean_app
      DB_PASSWORD: ${DB_PASSWORD:-dev_password_change_in_prod}
      PAYMENT_API_KEY: ${PAYMENT_API_KEY:-cp_test_devkey000000000000000000000000000000000000000000000000}
      ADMIN_API_KEY: ${ADMIN_API_KEY:-dev_admin_key}
      JWT_SECRET: ${JWT_SECRET:-dev_jwt_secret_change_in_prod}
    ports:
      - "3000:3000"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  postgres_data:
    name: ceruleanpay_postgres_data
